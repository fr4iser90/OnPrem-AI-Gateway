# OPTIONAL Traefik example (external Docker network "proxy").
# Default install: compose.yaml (no reverse proxy).
# Set DOMAIN (+ optional PUBLIC_SUBDOMAIN, default ai) in .env.
# Traefik: https://ai.${DOMAIN}/ (Web UI) and https://ai.${DOMAIN}/v1/... (API).
#
# Usage:  docker compose -f compose.traefik.yaml up -d --build

name: onprem

# Same auto UID/GID as compose.yaml — from your shell ($UID / $GID), not .env.
x-host-id: &host-id
  PUID: ${UID:-1000}
  PGID: ${GID:-1000}

x-restart: &restart
  restart: unless-stopped

x-proxy-net: &proxy-net
  networks:
    - proxy

services:
  onprem-auth:
    <<: [*restart, *proxy-net]
    build: .
    container_name: onprem-auth
    env_file: .env
    dns:
      - 1.1.1.1
    environment:
      <<: *host-id
      DATA_DIR: /data
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-admin}
      PORT: "8080"
    volumes:
      - onprem-auth-data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.onprem-admin.rule=Host(`${PUBLIC_SUBDOMAIN:-ai}.${DOMAIN}`)
      - traefik.http.routers.onprem-admin.entrypoints=websecure
      - traefik.http.routers.onprem-admin.tls=true
      - traefik.http.routers.onprem-admin.tls.certresolver=http_resolver
      - traefik.http.services.onprem-admin.loadbalancer.server.port=8080
      - traefik.http.routers.onprem-admin-http.rule=Host(`${PUBLIC_SUBDOMAIN:-ai}.${DOMAIN}`)
      - traefik.http.routers.onprem-admin-http.entrypoints=web
      - traefik.http.routers.onprem-admin-http.middlewares=onprem-https-redirect
      - traefik.http.middlewares.onprem-https-redirect.redirectscheme.scheme=https

  onprem-api:
    <<: [*restart, *proxy-net]
    image: nginx:alpine
    container_name: onprem-api
    depends_on:
      - onprem-auth
    env_file: .env
    dns:
      - 1.1.1.1
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./scripts/nginx-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.onprem-api.rule=Host(`${PUBLIC_SUBDOMAIN:-ai}.${DOMAIN}`) && PathPrefix(`/v1`)
      - traefik.http.routers.onprem-api.entrypoints=websecure
      - traefik.http.routers.onprem-api.tls=true
      - traefik.http.routers.onprem-api.tls.certresolver=http_resolver
      - traefik.http.services.onprem-api.loadbalancer.server.port=80
      # Traefik must flush SSE (pings) immediately; otherwise Claude Code idle-aborts (~20s).
      # Path stays: Traefik → nginx (this service) → onprem-auth. Does NOT bypass nginx.
      - traefik.http.services.onprem-api.loadbalancer.responseforwarding.flushinterval=1ms
      - traefik.http.routers.onprem-api-http.rule=Host(`${PUBLIC_SUBDOMAIN:-ai}.${DOMAIN}`) && PathPrefix(`/v1`)
      - traefik.http.routers.onprem-api-http.entrypoints=web
      - traefik.http.routers.onprem-api-http.middlewares=onprem-https-redirect

volumes:
  onprem-auth-data:

networks:
  proxy:
    external: true
