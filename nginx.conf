events {}

http {

  client_max_body_size 25m;

  # Docker embedded DNS (needed when proxy_pass uses variables / hostnames)
  resolver 127.0.0.11 ipv6=off valid=10s;

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;

  log_format detailed
  '$remote_addr '
  '$http_x_forwarded_for '
  '$host '
  '"$request" '
  '$status '
  '"$http_user_agent"';

  access_log /var/log/nginx/access.log detailed;

  upstream onprem_auth {
    server onprem-auth:8080;
  }

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Single API entry: path selects service (chat / embed / extractor / stt / tts).
  # Auth always returns X-Backend + X-Rewrite-Uri (OpenAI path → upstream dialect).
  # default_server = works with any Host (local ports) or PUBLIC_HOST via reverse proxy.
  server {
    listen 80 default_server;
    server_name ${PUBLIC_HOST} _;

    location = /_auth {
      internal;
      proxy_pass http://onprem_auth/v1/auth/check;
      proxy_pass_request_body on;
      proxy_set_header Content-Length $content_length;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_auth_nobody {
      internal;
      proxy_pass http://onprem_auth/v1/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location @auth_unauthorized {
      internal;
      default_type application/json;
      return 401 '{"error":"unauthorized"}';
    }

    location @auth_forbidden {
      internal;
      default_type application/json;
      return 403 '{"error":"forbidden"}';
    }

    location @auth_rate_limited {
      internal;
      default_type application/json;
      return 429 '{"error":"rate_limited"}';
    }

    location @auth_unavailable {
      internal;
      default_type application/json;
      return 503 '{"error":"unavailable"}';
    }

    # Named source metering paths MUST come before the catch-all /s/ regex
    # (nginx regex: first match wins).
    # Regex locations cannot use proxy_pass …/path — rewrite + upstream only.
    location ~ ^/s/[^/]+/v1/chat/completions$ {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location ~ ^/s/[^/]+/v1/completions$ {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location ~ ^/s/[^/]+/v1/embeddings$ {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location ~ ^/s/[^/]+/v1/extract$ {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location ~ ^/s/[^/]+/v1/audio/transcriptions {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
      client_max_body_size 25m;
    }

    location ~ ^/s/[^/]+/v1/audio/translations {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
      client_max_body_size 25m;
    }

    location ~ ^/s/[^/]+/v1/audio/speech {
      rewrite ^ /v1/onprem/entry break;
      proxy_pass http://onprem_auth;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    # Shared: auth → X-Backend + X-Rewrite-Uri → upstream (non-metered /s/ paths)
    # Optional VL rewrite: auth sets X-OnPrem-Proxy=1 + ticket → body rewrite via onprem-auth
    location ~ ^/s/[^/]+(/.*)$ {
      auth_request /_auth;
      auth_request_set $backend $upstream_http_x_backend;
      auth_request_set $rewrite_uri $upstream_http_x_rewrite_uri;
      auth_request_set $onprem_proxy $upstream_http_x_onprem_proxy;
      auth_request_set $onprem_ticket $upstream_http_x_onprem_ticket;
      error_page 401 = @auth_unauthorized;
      error_page 403 = @auth_forbidden;
      error_page 429 = @auth_rate_limited;
      error_page 503 = @auth_unavailable;
      proxy_set_header X-OnPrem-Ticket $onprem_ticket;
      set $pass http://$backend$rewrite_uri;
      if ($onprem_proxy = "1") {
        set $pass http://onprem_auth/v1/onprem/forward;
      }
      proxy_pass $pass$is_args$args;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    # Filtered model list (catalog ∩ grants ∩ allowlist) — served by onprem-auth
    location = /v1/models {
      proxy_pass http://onprem_auth/v1/onprem/models;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat + embeddings + extractor + STT/TTS: one hop on onprem-auth (auth + upstream + duration/Wh).
    # Do NOT use auth_request here — POST body + Starlette hangs (ClientDisconnect).
    # Per-source Wh: probe http://<source-host>:9105/power (sidecar on that machine).
    # Empty address → no probe; unreachable → power_status=unreachable.
    location = /v1/chat/completions {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location = /v1/completions {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location = /v1/embeddings {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location = /v1/extract {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location /v1/audio/transcriptions {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
      client_max_body_size 25m;
    }

    location /v1/audio/translations {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
      client_max_body_size 25m;
    }

    location /v1/audio/speech {
      proxy_pass http://onprem_auth/v1/onprem/entry;
      proxy_set_header X-Api-Key $http_x_api_key;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location /api/ {
      auth_request /_auth;
      auth_request_set $backend $upstream_http_x_backend;
      auth_request_set $rewrite_uri $upstream_http_x_rewrite_uri;
      auth_request_set $onprem_proxy $upstream_http_x_onprem_proxy;
      auth_request_set $onprem_ticket $upstream_http_x_onprem_ticket;
      error_page 401 = @auth_unauthorized;
      error_page 403 = @auth_forbidden;
      error_page 429 = @auth_rate_limited;
      error_page 503 = @auth_unavailable;
      proxy_set_header X-OnPrem-Ticket $onprem_ticket;
      set $pass http://$backend$rewrite_uri;
      if ($onprem_proxy = "1") {
        set $pass http://onprem_auth/v1/onprem/forward;
      }
      proxy_pass $pass$is_args$args;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location /v1/ {
      auth_request /_auth;
      auth_request_set $backend $upstream_http_x_backend;
      auth_request_set $rewrite_uri $upstream_http_x_rewrite_uri;
      auth_request_set $onprem_proxy $upstream_http_x_onprem_proxy;
      auth_request_set $onprem_ticket $upstream_http_x_onprem_ticket;
      error_page 401 = @auth_unauthorized;
      error_page 403 = @auth_forbidden;
      error_page 429 = @auth_rate_limited;
      error_page 503 = @auth_unavailable;
      proxy_set_header X-OnPrem-Ticket $onprem_ticket;
      set $pass http://$backend$rewrite_uri;
      if ($onprem_proxy = "1") {
        set $pass http://onprem_auth/v1/onprem/forward;
      }
      proxy_pass $pass$is_args$args;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

    location / {
      default_type application/json;
      return 404 '{"error":"unknown_path","hint":"use /v1/…, /s/{name}/v1/…, /v1/embeddings, /v1/extract, /v1/audio/*, or /api/*"}';
    }
  }
}
